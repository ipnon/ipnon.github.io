---
layout: default
---
<h1>{{ page.title }}</h1>
<p class="date">{{ page.date | date: "%B %d, %Y" }}</p>
{{ content }}
<link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
<script src="https://tikzjax.com/v1/tikzjax.js"></script>
<script>
  // TikZJax sets each SVG's viewBox from \useasboundingbox, but tikzpicture
  // content drawn past that rectangle still renders (overflow: visible) and
  // ends up outside the SVG element, which the column edge then clips with
  // no scrollbar. Read the real painted bbox via getBBox() and grow the
  // viewBox to its union with the original, so content can never spill out.
  (function () {
    function fit(svg) {
      if (!svg || svg.dataset.tikzFitted === '1') return;
      try {
        var bb = svg.getBBox();
        if (!bb.width || !bb.height) return;
        var vb = svg.viewBox.baseVal;
        var pad = 0.5;
        var x1 = Math.min(vb.x, bb.x - pad);
        var y1 = Math.min(vb.y, bb.y - pad);
        var x2 = Math.max(vb.x + vb.width, bb.x + bb.width + pad);
        var y2 = Math.max(vb.y + vb.height, bb.y + bb.height + pad);
        svg.setAttribute('viewBox', x1 + ' ' + y1 + ' ' + (x2 - x1) + ' ' + (y2 - y1));
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        svg.dataset.tikzFitted = '1';
      } catch (e) { /* not laid out yet; observer will retry */ }
    }
    function sweep() {
      document.querySelectorAll('.tikz-figure svg').forEach(fit);
    }
    new MutationObserver(function () {
      requestAnimationFrame(sweep);
    }).observe(document.body, { childList: true, subtree: true });
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sweep);
    } else {
      sweep();
    }
  })();
</script>
